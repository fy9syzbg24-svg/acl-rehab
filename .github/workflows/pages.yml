# Deploy the app/ folder to GitHub Pages on every push to main.
#
# Only app/ is published — the Python server, tools and tests stay in the repo
# but are not served. The PWA is entirely static, so there is no build step:
# what is in app/ is what runs.

name: Deploy PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build so the service worker picks up a new shell
        run: |
          # The SW only refreshes its precache when its own bytes change, so
          # bake the commit sha in. Without this, an installed PWA could sit on
          # an old shell indefinitely.
          sed -i "s/const SHELL_VERSION = 'v1';/const SHELL_VERSION = '${GITHUB_SHA::8}';/" app/sw.js
          grep -n "SHELL_VERSION" app/sw.js | head -1

      - name: Redirect the site root to the mobile app
        run: |
          cat > app/index-redirect.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./m.html">
          <title>Rehab tracker</title>
          <a href="./m.html">Open</a>
          HTML
          # index.html is the DESKTOP app; on Pages the phone should land on the
          # mobile one. Keep both, but make / go to mobile.
          mv app/index.html app/desktop.html
          mv app/index-redirect.html app/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
