<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Rehab tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark">ACL</span>
      <div class="brand-text">
        <span id="postop-strip" class="postop"></span>
      </div>
    </div>
    <h1 class="apptitle" id="app-title">Rehab tracker</h1>
    <div class="topbar-right">
      <span id="save-state" class="save-state"></span>
      <button class="msync" id="sync-btn" title="Sync now" aria-label="Sync now">
        <span class="msync-dot" id="sync-dot"></span>
        <span id="sync-label">Local</span>
      </button>
      <button class="icon-btn" id="nav-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="today">Today</button>
    <button data-view="program">My Program</button>
    <button data-view="plan">6-Month Plan</button>
    <button data-view="supplements">Supplements</button>
    <button data-view="progress">Progress</button>
  </nav>
</header>

<main id="view" class="view"></main>

<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
