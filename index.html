<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets the app paint under the Dynamic Island and
     the home indicator, and what makes env(safe-area-inset-*) return real
     numbers instead of zero. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehab">
<title>Rehab tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile.css">
</head>
<body class="mobile">

<header class="mtop">
  <div class="mtop-in">
    <button class="msync" id="sync-btn" aria-label="Sync now">
      <span class="msync-dot" id="sync-dot"></span>
      <span id="sync-label">Local</span>
    </button>
    <div class="mtitle-wrap">
      <h1 class="mtitle" id="app-title">Rehab</h1>
      <span class="mpostop" id="postop-strip"></span>
    </div>
    <button class="micon" id="nav-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    </button>
  </div>
</header>

<!-- class="view" so every desktop stylesheet rule applies unchanged -->
<main id="view" class="view mview"></main>

<nav class="mtabs" id="mtabs">
  <button data-view="today" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Today</span>
  </button>
  <button data-view="program">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/></svg>
    <span>Program</span>
  </button>
  <button data-view="supplements">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Supps</span>
  </button>
  <button data-view="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M8 16l4-6 4 3 4-7"/></svg>
    <span>Plan</span>
  </button>
  <button data-view="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
    <span>Progress</span>
  </button>
</nav>

<div id="modal-root"></div>

<script type="module" src="./js/mobile.js"></script>
</body>
</html>
