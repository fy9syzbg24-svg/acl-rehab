<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F6">
<title>Rehab tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-text">
        <span id="postop-strip" class="postop"></span>
      </div>
    </div>
    <h1 class="apptitle" id="app-title">Rehab tracker</h1>
    <div class="topbar-right">
      <span id="save-state" class="save-state"></span>
      <button class="msync" id="sync-btn" title="Sync now" aria-label="Sync now">
        <span class="msync-dot" id="sync-dot" aria-hidden="true"></span>
        <span id="sync-label">·</span>
      </button>
      <button class="icon-btn" id="nav-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>Today</span></button>
    <button data-view="program"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg><span>My Program</span></button>
    <button data-view="supplements"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 20.4a4.9 4.9 0 0 1-6.9-6.9l6.2-6.2a4.9 4.9 0 0 1 6.9 6.9z"/><path d="M6.8 10.4l6.8 6.8"/></svg><span>Supplements</span></button>
    <button data-view="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>6-Month Plan</span></button>
    <button data-view="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M6.5 16v-4M11 16V8.5M15.5 16v-6M20 16V5"/></svg><span>Progress</span></button>
    <button data-view="settings" class="rail-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span>Settings</span></button>
  </nav>
</header>

<main id="view" class="view"></main>

<div id="modal-root"></div>
<div id="live-root" class="sr-only" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
