<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Rehab tracker</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦵</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark">ACL</span>
      <div class="brand-text">
        <span id="postop-strip" class="postop"></span>
      </div>
    </div>
    <h1 class="apptitle" id="app-title">Rehab tracker</h1>
    <div class="topbar-right">
      <span id="save-state" class="save-state"></span>
      <button class="icon-btn" id="nav-settings" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="today">Today</button>
    <button data-view="program">My Program</button>
    <button data-view="plan">6-Month Plan</button>
    <button data-view="melbourne">Melbourne</button>
    <button data-view="progress">Progress</button>
  </nav>
</header>

<main id="view" class="view"></main>

<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
