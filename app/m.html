<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what lets the app paint under the Dynamic Island and
     the home indicator, and what makes env(safe-area-inset-*) return real
     numbers instead of zero. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehab">
<title>Rehab tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./mobile.css">
</head>
<body class="mobile">

<header class="mtop">
  <div class="mtop-in">
    <button class="msync" id="sync-btn" aria-label="Sync now">
      <span class="msync-dot" id="sync-dot"></span>
      <span id="sync-label">·</span>
    </button>
    <div class="mtitle-wrap">
      <h1 class="mtitle" id="app-title">Rehab</h1>
      <span class="mpostop" id="postop-strip"></span>
    </div>
    <button class="micon" id="nav-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
  </div>
</header>

<!-- class="view" so every desktop stylesheet rule applies unchanged -->
<main id="view" class="view mview"></main>

<nav class="mtabs" id="mtabs" aria-label="Sections">
  <button data-view="today" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>
    <span>Today</span>
  </button>
  <button data-view="program">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg>
    <span>Program</span>
  </button>
  <button data-view="supplements">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 20.4a4.9 4.9 0 0 1-6.9-6.9l6.2-6.2a4.9 4.9 0 0 1 6.9 6.9z"/><path d="M6.8 10.4l6.8 6.8"/></svg>
    <span>Supps</span>
  </button>
  <button data-view="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Plan</span>
  </button>
  <button data-view="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M6.5 16v-4M11 16V8.5M15.5 16v-6M20 16V5"/></svg>
    <span>Progress</span>
  </button>
  <button data-view="settings" class="rail-only">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    <span>Settings</span>
  </button>
</nav>

<div id="modal-root"></div>

<script type="module" src="./js/mobile.js"></script>
</body>
</html>
